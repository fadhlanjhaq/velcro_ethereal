; Batas upload PHP untuk Filament/Livewire. Default image php:8.4-fpm 2M/8M
; membuat upload > 2 MB gagal (FilePond terlihat stuck di 100%).
; Sengaja sedikit di atas batas Filament ->maxSize() (foto 5 MB, video 8 MB)
; supaya file kebesaran ditolak Filament dengan pesan validasi yang jelas.
; post_max_size harus > upload_max_filesize (ruang untuk field form lain).
; Batas lain di rantai ini: Livewire temporary_file_upload (default ~12 MB),
; nginx container client_max_body_size 20m, nginx host VPS 10m.
upload_max_filesize = 10M
post_max_size = 12M
