# =============================================================================
# Velcro Ethereal — reverse proxy (single entry point)
#
# Mounted into nginx:alpine at /etc/nginx/conf.d/default.conf.
#
# Routing:
#   /api/*  -> Laravel (php-fpm on api:9000), front controller = public/index.php
#   /up     -> Laravel health check (Laravel registers this at the root path)
#   *       -> if the request maps to a real file in Laravel's public/ (e.g.
#              /storage/*, /build/*), serve it directly; otherwise proxy to the
#              Next.js storefront (web:3000).
#
# `root` points at Laravel's public/, shared read-only from the api container
# via the `public_assets` volume, so Laravel's own static assets are served
# straight off disk while everything else falls through to Next.js.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # --- Laravel API ---------------------------------------------------------
    location /api {
        try_files $uri $uri/ @laravel;
    }

    # --- Laravel health check (bootstrap/app.php: health => '/up') -----------
    location = /up {
        try_files $uri @laravel;
    }

    # --- Default: Laravel static assets first, else the Next.js storefront ---
    location / {
        try_files $uri @web;
    }

    # --- Next.js storefront (standalone server) ------------------------------
    location @web {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Laravel front controller (php-fpm) ----------------------------------
    # Every Laravel request is routed through public/index.php; SCRIPT_FILENAME
    # is the path as seen INSIDE the api container. REQUEST_URI (from
    # fastcgi_params) preserves the original /api/... or /up path for routing.
    location @laravel {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # Do not leak dotfiles (e.g. a stray .env) served as static assets.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
